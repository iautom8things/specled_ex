name: Specs

on:
  pull_request:
    paths:
      - ".spec/**"
      - "lib/**"
      - "mix.exs"
      - "mix.lock"
      - "scripts/**"
      - "test/**"
      - "test_support/**"
      - "priv/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - ".spec/**"
      - "lib/**"
      - "mix.exs"
      - "mix.lock"
      - "scripts/**"
      - "test/**"
      - "test_support/**"
      - "priv/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check Specs
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the PR base ref exists for spec.check --base.
          fetch-depth: 0

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.3.1"

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Compile-connected xref gate
        # A compile-time dependency on a module that has its own dependencies
        # cascades recompilation across the app; keep the graph at zero edges.
        # Same target as the local Merge Gates checklist, so CI and local runs
        # cannot drift.
        run: make xref

      - name: Check specs
        # PR runs diff against the merge base (spec.check uses base...HEAD) so
        # append-only and co-update guards apply; push/dispatch keep bare HEAD.
        # SPECLED_COMMAND_OUTPUT_DIR preserves the full output (ExUnit seed,
        # counterexample) of any failing or timed-out verification command for
        # the artifact upload below — findings alone truncate it.
        env:
          SPECLED_COMMAND_OUTPUT_DIR: ${{ runner.temp }}/specled-command-output
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bash ./scripts/check_specs.sh --base "origin/${GITHUB_BASE_REF}"
          else
            bash ./scripts/check_specs.sh
          fi

      - name: Upload failing verification command output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: specled-command-output
          path: ${{ runner.temp }}/specled-command-output
          if-no-files-found: ignore

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native coverage path: :code.coverage_support/0 is true on OTP >= 27,
          # so SpecLedEx.Coverage.Snapshot.runtime_mode/0 selects :native.
          - elixir: "1.19.5"
            otp: "28.3.1"
          # Classic fallback: OTP < 27 exercises the :classic branch of
          # Snapshot.runtime_mode/0, which no other pipeline runs.
          - elixir: "1.18.4"
            otp: "26.2.5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        # Includes :integration (child-BEAM fixture runs). --cover arms the
        # mix.exs test_coverage threshold gate — per-leg provenance, measured
        # totals, and headroom disposition live in the comment above
        # test_coverage: in mix.exs (single source of truth; do not restate
        # numbers here). snapshot_test.exs's cover-compiled tmp fixture
        # modules run entirely in a quarantined child BEAM (their own :cover
        # coordinator, never this run's), so they can no longer leak spurious
        # 100% rows into the tally or crash the HTML report with
        # :no_source_code_found.
        run: mix test --include integration --cover
